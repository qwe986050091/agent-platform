name: ci
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本交给根 package.json 的 packageManager（pnpm@9.12.0）决定
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Electron 45 要求 Node >= 22.12
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (web / mobile / desktop / packages)
        run: pnpm typecheck
      - name: Build web
        run: pnpm build:web
      - name: Build desktop main process
        run: pnpm build:desktop
